<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Relevé chantier et dimensionnement climatisation / pompe à chaleur, calcul local et hors ligne.">
  <meta name="theme-color" content="#0f5f8c">
  <title>Relevé PAC Clim</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Thème appliqué avant le premier rendu pour éviter un flash.
    try {
      var t = localStorage.getItem('dimclim.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <img id="logo-entete" class="logo-img" alt="">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1L19.1 4.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <div class="topbar-text">
        <h1>Relevé PAC / Clim</h1>
        <p id="chantier-courant" class="muted small"></p>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn ghost icon-btn" id="btn-entreprise" aria-label="Mon entreprise (logo, coordonnées)" title="Mon entreprise">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5l8-3v19M12 9h8v12M7 8h2M7 12h2M7 16h2M15 13h2M15 17h2M2 21h20"/></svg>
      </button>
      <button type="button" class="btn ghost icon-btn" id="btn-theme" aria-label="Changer de thème"></button>
    </div>
  </header>

  <main id="app" class="app" aria-live="off"></main>

  <footer class="totals" id="totals" aria-label="Totaux et actions">
    <div class="totals-figures" id="totals-figures"></div>
    <nav class="totals-actions">
      <button type="button" class="btn" data-global="nouveau">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Nouveau</span>
      </button>
      <button type="button" class="btn" data-global="chantiers">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span>Chantiers</span>
      </button>
      <button type="button" class="btn" data-global="pdf">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6v18h12V7zM14 3v4h4M9 13h6M9 17h6"/></svg><span>PDF</span>
      </button>
      <button type="button" class="btn" data-global="email">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 6l9 7 9-7"/></svg><span>Email</span>
      </button>
      <button type="button" class="btn primary" data-global="sauver">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5zM8 3v5h7V3M8 21v-7h8v7"/></svg><span>Sauver</span>
      </button>
    </nav>
  </footer>

  <dialog id="dlg-chantiers" class="dialog">
    <div class="dialog-head">
      <h2>Mes chantiers</h2>
      <button type="button" class="btn ghost icon-btn" data-close aria-label="Fermer">✕</button>
    </div>
    <div id="liste-chantiers" class="dialog-body"></div>
  </dialog>

  <dialog id="dlg-entreprise" class="dialog">
    <div class="dialog-head">
      <h2>Mon entreprise</h2>
      <button type="button" class="btn ghost icon-btn" data-close aria-label="Fermer">✕</button>
    </div>
    <div id="form-entreprise" class="dialog-body"></div>
  </dialog>

  <dialog id="dlg-envoi" class="dialog">
    <div class="dialog-head">
      <h2>Envoyer par email</h2>
      <button type="button" class="btn ghost icon-btn" data-close aria-label="Fermer">✕</button>
    </div>
    <div id="form-envoi" class="dialog-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/format.js"></script>
  <script src="js/entreprise.js"></script>
  <script src="js/rapport.js"></script>
  <script src="js/envoi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
